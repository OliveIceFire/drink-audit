<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<title>古美酒水日盘</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111d;color:#eef4fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{display:flex;min-height:100vh}.side{width:190px;background:#0b1623;border-right:1px solid #1e2c3c;padding:20px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:19px;font-weight:800;margin-bottom:24px}.brand small{display:block;color:#8ea0b4;font-size:11px;margin-top:3px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#aebdcd;padding:11px 12px;border-radius:9px;font-size:14px}.nav button.active{background:#132d4e;color:#55a0ff}.db{position:absolute;bottom:18px;left:14px;right:14px;padding:12px;background:#101d2b;border:1px solid #213247;border-radius:10px;font-size:12px;color:#92a6ba}.db b{display:block;color:#eaf2fa;margin-bottom:7px}.dot{color:#47d16c}.main{margin-left:190px;width:calc(100% - 190px);padding:18px;max-width:1500px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.title{font-size:22px;font-weight:800}.datebox{display:flex;align-items:center;gap:8px}.datebox input,.btn{height:38px;border:1px solid #2b3b4e;background:#101b28;color:#eef4fb;border-radius:8px;padding:0 12px}.btn{cursor:pointer;font-weight:700}.btn.blue{background:#1768e7;border-color:#1768e7}.btn.green{background:#25833d;border-color:#25833d}.btn.red{background:#a93232;border-color:#a93232}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}.card{background:#101c2a;border:1px solid #203247;border-radius:10px;padding:13px 15px;color:#99aabd;font-size:12px}.card strong{display:block;font-size:24px;margin-top:5px;color:#f3f7fb}.card:nth-child(1) strong{color:#4b8dff}.card:nth-child(2) strong{color:#49d46b}.card:nth-child(3) strong{color:#e5a42b}.card:nth-child(4) strong,.card:nth-child(5) strong{color:#ff5656}.panel{background:#0d1825;border:1px solid #203247;border-radius:10px;overflow:hidden}.tabs{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0;border-bottom:1px solid #223247}.tabset{display:flex;gap:22px}.tab{padding:0 2px 11px;color:#a9b7c6;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:#4f9cff;border-bottom-color:#368dff;font-weight:700}.actions{display:flex;gap:8px;padding-bottom:10px;flex-wrap:wrap}.tablewrap{overflow:auto}.sheet{width:100%;border-collapse:collapse;min-width:1050px}.sheet th,.sheet td{padding:8px 9px;border-bottom:1px solid #1e2b39;text-align:right;font-size:13px;white-space:nowrap}.sheet th{color:#d7e1eb;font-size:12px;background:#0d1825;position:sticky;top:0;z-index:2}.sheet th:first-child,.sheet td:first-child{text-align:left}.sheet td:first-child{font-weight:700}.sheet input{width:82px;height:31px;background:#121a22;border:1px solid #304052;border-radius:5px;color:#fff;padding:0 8px;text-align:right;font-size:13px}.sheet input:focus{outline:1px solid #3f91ff;border-color:#3f91ff}.auto{color:#48d26e;font-weight:700}.missing{font-weight:800}.missing.bad{color:#ff5555}.badge{display:inline-block;min-width:42px;text-align:center;padding:4px 7px;border-radius:6px;font-weight:700;font-size:12px}.badge.ok{background:#10361f;color:#58da77}.badge.bad{background:#461d20;color:#ff6969}.total td{font-weight:800;background:#0a1420}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;color:#8396aa;font-size:12px}.footBtns{display:flex;gap:8px;flex-wrap:wrap}.empty{color:#65788e}.mobileHead{display:none}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#16283b;border:1px solid #31506c;color:#fff;padding:10px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}
@media(max-width:850px){.side{display:none}.main{margin-left:0;width:100%;padding:10px}.mobileHead{display:block;font-weight:800;font-size:18px;margin:2px 0 10px}.top .title{display:none}.top{align-items:flex-start}.datebox{width:100%;justify-content:space-between}.summary{grid-template-columns:repeat(2,1fr)}.summary .card:last-child{grid-column:span 2}.card{padding:11px}.card strong{font-size:21px}.tabs{align-items:flex-start;flex-direction:column;gap:10px}.actions{width:100%;overflow:auto;flex-wrap:nowrap}.btn{white-space:nowrap}.sheet th,.sheet td{padding:7px}.sheet input{width:72px}.foot{align-items:flex-start;flex-direction:column}.footBtns{width:100%}.footBtns .btn{flex:1}.panel{border-radius:8px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">酒水核查系统<small>V1.1</small></div>
  <div class="nav">
    <button class="active">▣ 日盘核查</button><button onclick="showHistory()">◷ 历史记录</button><button onclick="switchTab('pack')">▤ 单件瓶数</button><button>□ 进货记录</button><button>□ 销售记录</button><button>⌁ 数据统计</button><button>⇩ 导出数据</button>
  </div>
  <div class="db"><b>古美酒水日盘</b><span class="dot">● 已连接本机数据</span><br><br>浏览器本地保存</div>
</aside>
<main class="main">
  <div class="mobileHead">古美酒水日盘</div>
  <div class="top">
    <div class="title">酒水日盘核查</div>
    <div class="datebox"><input id="auditDate" type="date"><button class="btn blue" onclick="newDay()">＋ 新建日盘</button></div>
  </div>
  <section class="summary">
    <div class="card">品项总数<strong id="sCount">25</strong></div>
    <div class="card">理论总库存<strong id="sTheory">0</strong></div>
    <div class="card">实际总库存<strong id="sActual">0</strong></div>
    <div class="card">总差异（漏单）<strong id="sMissing">0</strong></div>
    <div class="card">异常品项<strong id="sBad">0</strong></div>
  </section>
  <section class="panel" id="captureArea">
    <div class="tabs">
      <div class="tabset"><div id="tabDaily" class="tab active" onclick="switchTab('daily')">古美酒水日盘</div><div id="tabPack" class="tab" onclick="switchTab('pack')">单件瓶数</div></div>
      <div class="actions"><button class="btn blue" onclick="carryYesterday()">继承昨日剩余</button><button class="btn" onclick="resetCurrent()">重置</button><button class="btn green" onclick="saveDay()">保存日盘</button></div>
    </div>
    <div class="tablewrap"><table class="sheet"><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div>
    <div class="foot"><div id="formula">漏单 = 初始库存 + 进货 − 销量 − 剩余库存</div><div class="footBtns"><button class="btn" onclick="showHistory()">查看历史记录</button><button class="btn" onclick="exportImage()">导出图片</button><button class="btn red" onclick="deleteDay()">删除本日盘</button></div></div>
  </section>
</main>
</div>
<div id="toast" class="toast"></div>
<script>
const BASE=[
{name:'雪花纯生',start:48,cases:0,caseSize:12,sales:14,actual:33},
{name:'超级勇闯',start:51,cases:0,caseSize:12,sales:0,actual:51},
{name:'百威',start:35,cases:0,caseSize:12,sales:0,actual:35},
{name:'喜力',start:29,cases:0,caseSize:12,sales:6,actual:23},
{name:'老雪花',start:40,cases:0,caseSize:12,sales:11,actual:28},
{name:'青岛',start:1,cases:3,caseSize:12,sales:0,actual:37},
{name:'乌毡帽',start:8,cases:0,caseSize:6,sales:0,actual:8},
{name:'大窑荔爱',start:41,cases:0,caseSize:12,sales:5,actual:36},
{name:'大窑橙诺',start:45,cases:1,caseSize:12,sales:10,actual:47},
{name:'北冰洋',start:54,cases:0,caseSize:'',sales:1,actual:53},
{name:'听可乐',start:46,cases:0,caseSize:24,sales:8,actual:38},
{name:'听雪碧',start:31,cases:0,caseSize:24,sales:5,actual:26},
{name:'无糖可乐',start:44,cases:0,caseSize:'',sales:0,actual:44},
{name:'王老吉',start:28,cases:1,caseSize:24,sales:6,actual:46},
{name:'果粒橙',start:22,cases:0,caseSize:12,sales:1,actual:21},
{name:'大可乐',start:22,cases:0,caseSize:12,sales:2,actual:20},
{name:'大雪碧',start:13,cases:0,caseSize:12,sales:1,actual:12},
{name:'矿泉水',start:36,cases:0,caseSize:24,sales:0,actual:36},
{name:'唯怡豆奶',start:44,cases:0,caseSize:'',sales:4,actual:40},
{name:'椰子水',start:15,cases:0,caseSize:'',sales:4,actual:11},
{name:'光明酸奶',start:5,cases:1,caseSize:12,sales:1,actual:16},
{name:'30白啤',start:15,cases:0,caseSize:'',sales:0,actual:15},
{name:'力波白啤',start:8,cases:0,caseSize:'',sales:1,actual:7},
{name:'小郎酒',start:17,cases:0,caseSize:'',sales:0,actual:17},
{name:'古越龙山',start:2,cases:1,caseSize:12,sales:0,actual:14}
];
const STORE='gumei-drink-audit-v11';let view='daily';let rows=[];
const clone=x=>JSON.parse(JSON.stringify(x));
function localDate(){let d=new Date(),o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10)}
function key(d){return STORE+'-'+d}
function draftKey(d){return STORE+'-draft-'+d}
function n(v){return v===''||v==null?0:Number(v)||0}
function incoming(r){return n(r.cases)*n(r.caseSize)}
function missing(r){return n(r.start)+incoming(r)-n(r.sales)-n(r.actual)}
function theory(r){return n(r.start)+incoming(r)-n(r.sales)}
function loadDate(d){let saved=localStorage.getItem(key(d)),draft=localStorage.getItem(draftKey(d));rows=saved?JSON.parse(saved):draft?JSON.parse(draft):clone(BASE);render()}
function persistDraft(){localStorage.setItem(draftKey(auditDate.value),JSON.stringify(rows))}
function input(i,k,v){rows[i][k]=(k==='caseSize'&&v==='')?'':n(v);persistDraft();render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){renderSummary();if(view==='daily')renderDaily();else renderPack()}
function renderSummary(){let th=0,ac=0,mis=0,bad=0;rows.forEach(r=>{th+=theory(r);ac+=n(r.actual);let m=missing(r);mis+=m;if(m!==0)bad++});sCount.textContent=rows.length;sTheory.textContent=th;sActual.textContent=ac;sMissing.textContent=mis;sBad.textContent=bad}
function renderDaily(){tabDaily.classList.add('active');tabPack.classList.remove('active');thead.innerHTML='<tr><th>品名</th><th>初始库存（瓶）</th><th>进货（件）</th><th>单件瓶数</th><th>进货总瓶数</th><th>销量（瓶）</th><th>剩余库存（瓶）</th><th>漏单（瓶）</th><th>状态</th></tr>';tbody.innerHTML=rows.map((r,i)=>{let inc=incoming(r),m=missing(r);return `<tr><td>${esc(r.name)}</td><td><input inputmode="numeric" value="${r.start}" onchange="input(${i},'start',this.value)"></td><td><input inputmode="numeric" value="${r.cases}" onchange="input(${i},'cases',this.value)"></td><td><input inputmode="numeric" placeholder="未设置" value="${r.caseSize}" onchange="input(${i},'caseSize',this.value)"></td><td class="auto">${inc}</td><td><input inputmode="numeric" value="${r.sales}" onchange="input(${i},'sales',this.value)"></td><td><input inputmode="numeric" value="${r.actual}" onchange="input(${i},'actual',this.value)"></td><td class="missing ${m!==0?'bad':''}">${m}</td><td><span class="badge ${m===0?'ok':'bad'}">${m===0?'正常':'异常'}</span></td></tr>`}).join('');let sum=(f)=>rows.reduce((a,r)=>a+f(r),0);tfoot.innerHTML=`<tr class="total"><td>合计</td><td>${sum(r=>n(r.start))}</td><td>${sum(r=>n(r.cases))}</td><td>—</td><td class="auto">${sum(incoming)}</td><td>${sum(r=>n(r.sales))}</td><td>${sum(r=>n(r.actual))}</td><td class="missing ${sum(missing)!==0?'bad':''}">${sum(missing)}</td><td></td></tr>`;formula.textContent='漏单 = 初始库存 + 进货总瓶数 − 销量 − 剩余库存'}
function renderPack(){tabPack.classList.add('active');tabDaily.classList.remove('active');thead.innerHTML='<tr><th>品名</th><th>单件瓶数</th><th>当天订货件数</th><th>进货总瓶数</th></tr>';tbody.innerHTML=rows.map((r,i)=>`<tr><td>${esc(r.name)}</td><td><input inputmode="numeric" placeholder="未设置" value="${r.caseSize}" onchange="input(${i},'caseSize',this.value)"></td><td><input inputmode="numeric" value="${r.cases}" onchange="input(${i},'cases',this.value)"></td><td class="auto">${incoming(r)}</td></tr>`).join('');tfoot.innerHTML='';formula.textContent='进货总瓶数 = 单件瓶数 × 当天订货件数'}
function switchTab(v){view=v;render()}
function saveDay(){localStorage.setItem(key(auditDate.value),JSON.stringify(rows));localStorage.removeItem(draftKey(auditDate.value));toastMsg('本日盘已保存')}
function carryYesterday(){let d=new Date(auditDate.value+'T12:00:00');d.setDate(d.getDate()-1);let prev=localStorage.getItem(key(localISO(d)));if(!prev)return toastMsg('没有找到昨日已保存日盘');let p=JSON.parse(prev),map=Object.fromEntries(p.map(r=>[r.name,r.actual]));rows.forEach(r=>{if(map[r.name]!=null)r.start=map[r.name];r.cases=0;r.sales=0;r.actual=r.start});persistDraft();render();toastMsg('已继承昨日剩余')}
function localISO(d){let o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10)}
function resetCurrent(){if(!confirm('确定重置当天数据？'))return;rows=clone(BASE);persistDraft();render()}
function deleteDay(){if(!confirm('确定删除 '+auditDate.value+' 的日盘？'))return;localStorage.removeItem(key(auditDate.value));localStorage.removeItem(draftKey(auditDate.value));rows=clone(BASE);render();toastMsg('已删除')}
function newDay(){auditDate.value=localDate();loadDate(auditDate.value)}
function showHistory(){let dates=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith(STORE+'-20')&&!k.includes('-draft-'))dates.push(k.replace(STORE+'-',''))}dates.sort().reverse();alert(dates.length?'已保存日盘：\n'+dates.join('\n'):'暂时没有已保存历史记录')}
async function exportImage(){if(typeof html2canvas==='undefined'){toastMsg('图片组件加载失败，请刷新后重试');return}toastMsg('正在生成图片…');let actions=document.querySelector('.actions'),footBtns=document.querySelector('.footBtns');actions.style.display='none';footBtns.style.display='none';try{let canvas=await html2canvas(captureArea,{backgroundColor:'#0d1825',scale:2,useCORS:true,windowWidth:1200});let link=document.createElement('a');link.download=`古美酒水日盘_${auditDate.value}.png`;link.href=canvas.toDataURL('image/png');link.click();toastMsg('图片已导出，可直接发微信')}catch(e){toastMsg('导出失败，请重试')}finally{actions.style.display='flex';footBtns.style.display='flex'}}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>toast.classList.remove('show'),1800)}
auditDate.value=localDate();auditDate.addEventListener('change',()=>loadDate(auditDate.value));loadDate(auditDate.value);
</script>
</body></html>
