ound:#10361f;color:#58da77}.badge.bad{background:#461d20;color:#ff6969}.total td{font-weight:800;background:#0a1420}.total td:first-child{background:#0c1722}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;color:#8396aa;font-size:12px}.footBtns{display:flex;gap:8px;flex-wrap:wrap}.mobileHead{display:none}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#16283b;border:1px solid #31506c;color:#fff;padding:10px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}.exportStage{position:fixed;left:-20000px;top:0;width:1120px;background:#08111d;color:#eef4fb;padding:28px;z-index:-1}.exportTitle{font-size:30px;font-weight:800;margin-bottom:6px}.exportDate{color:#9fb0c4;font-size:16px;margin-bottom:18px}.exportSummary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.exportCard{background:#101c2a;border:1px solid #203247;border-radius:10px;padding:12px}.exportCard span{display:block;color:#95a8bd;font-size:12px}.exportCard strong{display:block;font-size:22px;margin-top:4px}.exportTable{width:100%;border-collapse:collapse;background:#0d1825;border:1px solid #203247}.exportTable th,.exportTable td{border:1px solid #263649;padding:10px 8px;font-size:14px;text-align:right}.exportTable th{background:#122033;color:#dce8f4}.exportTable th:first-child,.exportTable td:first-child{text-align:left;font-weight:700}.exportTable tr.totalRow td{font-weight:800;background:#0a1420}.exportOk{color:#58da77;font-weight:800}.exportBad{color:#ff6969;font-weight:800}.exportFoot{margin-top:14px;color:#92a6ba;font-size:13px}

</style></head><body><div class="app"><aside class="side"><div class="brand">酒水核查系统<small>V1.5</small></div><div class="nav"><button class="active">▣ 日盘核查</button><button onclick="showHistory()">◷ 历史记录</button><button onclick="switchTab('pack')">▤ 单件瓶数</button><button>□ 进货记录</button><button>□ 销售记录</button><button>⌁ 数据统计</button><button onclick="exportImage()">⇩ 保存图片</button></div><div class="db"><b>古美酒水日盘</b><span class="dot">● 已连接本机数据</span><br><br>浏览器本地保存</div></aside><main class="main"><div class="mobileHead">古美酒水日盘</div><div class="top"><div class="title">酒水日盘核查</div><div class="datebox"><input id="auditDate" type="date"><button class="btn blue" onclick="newDay()">＋ 新建日盘</button></div></div><section class="summary"><div class="card">品项总数<strong id="sCount">26</strong></div><div class="card">理论总库存<strong id="sTheory">0</strong></div><div class="card">实际总库存<strong id="sActual">0</strong></div><div class="card">总差异（漏单）<strong id="sMissing">0</strong></div><div class="card">异常品项<strong id="sBad">0</strong></div></section><section class="parser"><div class="parserTitle">粘贴酒水订货信息</div><div class="parserHint">两个订货群分别粘贴，系统自动合并件数并换算进货总瓶数。</div><div class="parserGrid"><div class="parserBox"><label>订货群 1</label><textarea id="orderText1" placeholder="北冰洋1件&#10;百威1件&#10;老雪花3件"></textarea></div><div class="parserBox"><label>订货群 2</label><textarea id="orderText2" placeholder="小鹿可1件&#10;喜力2件&#10;上海力波2件"></textarea></div></div><div class="parserActions"><button class="btn blue" onclick="parseOrders()">自动分析两个订货群</button><button class="btn" onclick="clearOrderTexts()">清空</button></div><div id="parseResult" class="parseResult"></div></section><section class="panel"><div class="tabs"><div class="tabset"><div id="tabDaily" class="tab active" onclick="switchTab('daily')">古美酒水日盘</div><div id="tabPack" class="tab" onclick="switchTab('pack')">单件瓶数</div></div><div class="actions"><button class="btn blue" onclick="carryYesterday()">继承昨日剩余</button><button class="btn" onclick="resetCurrent()">重置</button><button class="btn green" onclick="saveDay()">保存日盘</button></div></div><div class="tablewrap"><table class="sheet"><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div><div class="foot"><div id="formula">漏单 = 初始库存 + 进货总瓶数 − 销量 − 剩余库存</div><div class="footBtns"><button class="btn" onclick="showHistory()">历史</button><button class="btn green" onclick="exportImage()">保存图片</button><button class="btn red" onclick="deleteDay()">删除</button></div></div></section></main></div><div id="toast" class="toast"></div><div id="exportStage" class="exportStage"></div><script>
const BASE=[{name:'雪花纯生',start:52,cases:0,caseSize:12,sales:7,actual:45},{name:'超级勇闯',start:15,cases:0,caseSize:12,sales:3,actual:12},{name:'百威',start:25,cases:0,caseSize:12,sales:1,actual:24},{name:'喜力',start:15,cases:0,caseSize:12,sales:8,actual:7},{name:'老雪花',start:12,cases:0,caseSize:12,sales:1,actual:11},{name:'青岛',start:42,cases:0,caseSize:12,sales:10,actual:32},{name:'乌毡帽',start:13,cases:0,caseSize:6,sales:0,actual:13},{name:'大窑荔爱',start:38,cases:0,caseSize:12,sales:2,actual:36},{name:'大窑橙诺',start:32,cases:0,caseSize:12,sales:3,actual:29},{name:'北冰洋',start:15,cases:0,caseSize:24,sales:1,actual:14},{name:'听可乐',start:6,cases:2,caseSize:24,sales:7,actual:47},{name:'听雪碧',start:24,cases:0,caseSize:24,sales:1,actual:23},{name:'无糖可乐',start:24,cases:0,caseSize:24,sales:3,actual:21},{name:'王老吉',start:5,cases:2,caseSize:24,sales:6,actual:47},{name:'果粒橙',start:9,cases:0,caseSize:12,sales:1,actual:8},{name:'大可乐',start:14,cases:0,caseSize:12,sales:3,actual:11},{name:'大雪碧',start:15,cases:0,caseSize:12,sales:0,actual:15},{name:'矿泉水',start:29,cases:0,caseSize:24,sales:3,actual:26},{name:'唯怡豆奶',start:9,cases:1,caseSize:20,sales:2,actual:27},{name:'椰子水',start:6,cases:0,caseSize:15,sales:3,actual:3},{name:'光明酸奶',start:8,cases:0,caseSize:12,sales:4,actual:4},{name:'30白啤',start:10,cases:0,caseSize:6,sales:0,actual:10},{name:'力波白啤',start:8,cases:0,caseSize:6,sales:2,actual:6},{name:'小郎酒',start:11,cases:0,caseSize:24,sales:1,actual:10},{name:'古越龙山',start:3,cases:0,caseSize:12,sales:0,actual:3},{name:'LOOK',start:0,cases:0,caseSize:24,sales:0,actual:0}];
const STORE='gumei-drink-audit-v15';let view='daily';let rows=[];const clone=x=>JSON.parse(JSON.stringify(x));const n=v=>Number(v)||0;const incoming=r=>n(r.cases)*n(r.caseSize);const theory=r=>n(r.start)+incoming(r)-n(r.sales);const missing=r=>theory(r)-n(r.actual);function key(d){return STORE+'-'+d}function draftKey(d){return STORE+'-draft-'+d}function persistDraft(){localStorage.setItem(draftKey(auditDate.value),JSON.stringify(rows))}function loadDate(d){let saved=localStorage.getItem(key(d)),draft=localStorage.getItem(draftKey(d));rows=saved?JSON.parse(saved):draft?JSON.parse(draft):clone(BASE);render()}function input(i,k,v){rows[i][k]=n(v);persistDraft();render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let th=0,ac=0,mis=0,bad=0;rows.forEach(r=>{th+=theory(r);ac+=n(r.actual);let m=missing(r);mis+=m;if(m!==0)bad++});sCount.textContent=rows.length;sTheory.textContent=th;sActual.textContent=ac;sMissing.textContent=mis;sBad.textContent=bad;view==='daily'?renderDaily():renderPack()}
function renderDaily(){tabDaily.classList.add('active');tabPack.classList.remove('active');let mobile=innerWidth<=850;thead.innerHTML=mobile?'<tr><th>品名</th><th>初始</th><th>进货</th><th>剩余</th><th>销量</th><th>漏单</th><th>状态</th></tr>':'<tr><th>品名</th><th>初始库存（瓶）</th><th>进货总瓶数</th><th>剩余库存（瓶）</th><th>销量（瓶）</th><th>漏单（瓶）</th><th>状态</th></tr>';tbody.innerHTML=rows.map((r,i)=>{let inc=incoming(r),m=missing(r);return `<tr><td>${esc(r.name)}</td><td><input inputmode="numeric" value="${r.start}" onchange="input(${i},'start',this.value)"></td><td class="auto">${inc}</td><td><input inputmode="numeric" value="${r.actual}" onchange="input(${i},'actual',this.value)"></td><td><input inputmode="numeric" value="${r.sales}" onchange="input(${i},'sales',this.value)"></td><td class="missing ${m!==0?'bad':''}">${m}</td><td><span class="badge ${m===0?'ok':'bad'}">${m===0?'正常':'异常'}</span></td></tr>`}).join('');let sum=f=>rows.reduce((a,r)=>a+f(r),0);tfoot.innerHTML=`<tr class="total"><td>合计</td><td>${sum(r=>n(r.start))}</td><td>${sum(incoming)}</td><td>${sum(r=>n(r.actual))}</td><td>${sum(r=>n(r.sales))}</td><td>${sum(missing)}</td><td>—</td></tr>`;formula.textContent='漏单 = 初始库存 + 进货总瓶数 − 销量 − 剩余库存'}
function renderPack(){tabDaily.classList.remove('active');tabPack.classList.add('active');thead.innerHTML='<tr><th>品名</th><th>单件瓶数</th><th>订货件数</th><th>进货总瓶数</th></tr>';tbody.innerHTML=rows.map((r,i)=>`<tr><td>${esc(r.name)}</td><td><input inputmode="numeric" value="${r.caseSize}" onchange="input(${i},'caseSize',this.value)"></td><td><input inputmode="numeric" value="${r.cases}" onchange="input(${i},'cases',this.value)"></td><td class="auto">${incoming(r)}</td></tr>`).join('');tfoot.innerHTML='';formula.textContent='进货总瓶数 = 单件瓶数 × 当天订货件数'}
function switchTab(v){view=v;render()}function saveDay(){localStorage.setItem(key(auditDate.value),JSON.stringify(rows));toastMsg('已保存 '+auditDate.value)}function newDay(){rows=clone(BASE);rows.forEach(r=>{r.cases=0;r.sales=0;r.actual=r.start});persistDraft();render();toastMsg('已新建日盘')}function resetCurrent(){localStorage.removeItem(draftKey(auditDate.value));rows=clone(BASE);render();toastMsg('已重置')}function carryYesterday(){let d=new Date(auditDate.value+'T00:00:00');d.setDate(d.getDate()-1);let k=d.toISOString().slice(0,10),prev=JSON.parse(localStorage.getItem(key(k))||'null');if(!prev)return toastMsg('没有昨日已保存记录');let mp=Object.fromEntries(prev.map(r=>[r.name,r.actual]));rows.forEach(r=>{if(mp[r.name]!=null)r.start=mp[r.name];r.cases=0;r.sales=0;r.actual=r.start});persistDraft();render();toastMsg('已继承昨日剩余')}
const ALIASES={'小噜渴':'LOOK','小鹿可':'LOOK','噜渴':'LOOK','look':'LOOK','LOOK':'LOOK','上海力波':'力波白啤','力波':'力波白啤','力波白啤':'力波白啤','超级勇闯':'超级勇闯','勇闯':'超级勇闯','大窑橙诺':'大窑橙诺','橙诺':'大窑橙诺'};function normalizeName(s){let t=s.trim();if(ALIASES[t])return ALIASES[t];let found=rows.find(r=>t.includes(r.name)||r.name.includes(t));if(found)return found.name;for(let k in ALIASES){if(t.toLowerCase().includes(k.toLowerCase()))return ALIASES[k]}return t}function parseOne(text,totals,unmatched){let lines=text.split(/\n|，|,|；|;/).map(x=>x.trim()).filter(Boolean);for(let line of lines){let m=line.match(/([^0-9\s]+?)\s*[xX×*]?\s*(\d+(?:\.\d+)?)\s*(?:件|箱)/);if(!m)continue;let name=normalizeName(m[1]);let qty=Number(m[2]);let r=rows.find(x=>x.name===name);if(r)totals[name]=(totals[name]||0)+qty;else unmatched.push(m[1])}}function parseOrders(){let t1=orderText1.value.trim(),t2=orderText2.value.trim();if(!t1&&!t2)return toastMsg('先粘贴至少一个订货群');let totals={},unmatched=[];parseOne(t1,totals,unmatched);parseOne(t2,totals,unmatched);let names=Object.keys(totals);if(!names.length){parseResult.textContent='没有识别到“品名 + 件数”的内容';return}rows.forEach(r=>r.cases=0);let matched=[];for(let name of names){let r=rows.find(x=>x.name===name);if(!r)continue;r.cases=totals[name];matched.push(`${r.name}${r.cases}件 → ${incoming(r)}瓶`)}persistDraft();render();parseResult.textContent='已合并：'+matched.join('；')+(unmatched.length?'。未匹配：'+[...new Set(unmatched)].join('、'):'');toastMsg('两个订货群已合并写入')}function clearOrderTexts(){orderText1.value='';orderText2.value='';parseResult.textContent=''}
function showHistory(){let arr=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith(STORE+'-')&&!k.includes('-draft-'))arr.push(k.replace(STORE+'-',''))}alert(arr.length?'已保存日期：\n'+arr.sort().join('\n'):'暂无历史记录')}function deleteDay(){if(confirm('确定删除 '+auditDate.value+' 的已保存日盘？')){localStorage.removeItem(key(auditDate.value));localStorage.removeItem(draftKey(auditDate.value));rows=clone(BASE);render();toastMsg('已删除')}}
function exportMarkup(){let sum=f=>rows.reduce((a,r)=>a+f(r),0);let th=sum(theory),ac=sum(r=>n(r.actual)),mis=sum(missing),bad=rows.filter(r=>missing(r)!==0).length;let body=rows.map(r=>{let m=missing(r);return `<tr><td>${esc(r.name)}</td><td>${n(r.start)}</td><td>${incoming(r)}</td><td>${n(r.actual)}</td><td>${n(r.sales)}</td><td class="${m===0?'exportOk':'exportBad'}">${m}</td><td class="${m===0?'exportOk':'exportBad'}">${m===0?'正常':'异常'}</td></tr>`}).join('');return `<div class="exportTitle">古美酒水日盘</div><div class="exportDate">日期：${auditDate.value}</div><div class="exportSummary"><div class="exportCard"><span>品项总数</span><strong>${rows.length}</strong></div><div class="exportCard"><span>理论总库存</span><strong>${th}</strong></div><div class="exportCard"><span>实际总库存</span><strong>${ac}</strong></div><div class="exportCard"><span>总差异（漏单）</span><strong>${mis}</strong></div><div class="exportCard"><span>异常品项</span><strong>${bad}</strong></div></div><table class="exportTable"><thead><tr><th>品名</th><th>初始库存（瓶）</th><th>进货总瓶数</th><th>剩余库存（瓶）</th><th>销量（瓶）</th><th>漏单（瓶）</th><th>状态</th></tr></thead><tbody>${body}</tbody><tfoot><tr class="totalRow"><td>合计</td><td>${sum(r=>n(r.start))}</td><td>${sum(incoming)}</td><td>${sum(r=>n(r.actual))}</td><td>${sum(r=>n(r.sales))}</td><td>${mis}</td><td>—</td></tr></tfoot></table><div class="exportFoot">漏单 = 初始库存 + 进货总瓶数 − 销量 − 剩余库存</div>`}async function exportImage(){if(typeof html2canvas==='undefined')return toastMsg('图片组件加载失败，请稍后重试');toastMsg('正在生成完整图片…');exportStage.innerHTML=exportMarkup();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));try{let canvas=await html2canvas(exportStage,{backgroundColor:'#08111d',scale:2,width:1120,windowWidth:1120,scrollX:0,scrollY:0});let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png',1));if(!blob)throw new Error('blob');let file=new File([blob],`古美酒水日盘_${auditDate.value}.png`,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:`古美酒水日盘 ${auditDate.value}`});toastMsg('可在分享面板点“保存图像”')}else{let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toastMsg('图片已生成并下载')}}catch(e){if(e&&e.name==='AbortError')toastMsg('已取消保存');else toastMsg('图片生成失败，请重试')}finally{exportStage.innerHTML=''}}function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}auditDate.value='2026-09-01';auditDate.addEventListener('change',()=>loadDate(auditDate.value));addEventListener('resize',()=>render());loadDate(auditDate.value);
</script></body></html>
