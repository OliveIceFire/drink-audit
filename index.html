<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><title>酒水核查</title><style>body{margin:0;background:#0d1117;color:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{padding:14px;max-width:1200px;margin:auto}h1{margin:4px 0 2px}.sub{color:#8f98a5;font-size:13px}.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.card{background:#171c24;border:1px solid #29313c;border-radius:14px;padding:12px}.card b{display:block;font-size:24px;margin-top:5px}.table{overflow:auto;background:#10161d;border:1px solid #27313d;border-radius:14px}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:9px 7px;border-bottom:1px solid #252c35;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#151b23;color:#c6ced8;position:sticky;top:0}.name{font-weight:700}input{width:72px;background:#111820;color:#fff;border:1px solid #313a46;border-radius:7px;padding:7px;text-align:right}.green{color:#5bd38b;font-weight:800}.red{color:#ff6a6a;font-weight:800}.badge{padding:4px 7px;border-radius:8px;font-size:12px}.ok{background:#173323;color:#68df91}.bad{background:#3a1d20;color:#ff7979}.actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}button{padding:10px 13px;border:1px solid #2f3b49;background:#18212b;color:#fff;border-radius:10px;font-weight:700}button.primary{background:#2f7cff;border-color:#2f7cff}@media(max-width:700px){.sum{grid-template-columns:repeat(2,1fr)}main{padding:10px}}</style></head><body><main><h1>酒水核查系统</h1><div class="sub">手机在线验证版 · 输入立即重算并保存在本机浏览器</div><div class="sum"><div class="card">品项<b id="s1"></b></div><div class="card">理论总库存<b id="s2"></b></div><div class="card">实际总库存<b id="s3"></b></div><div class="card">异常品项<b id="s4"></b></div></div><div class="actions"><button onclick="carry()">继承昨日剩余</button><button onclick="saveDay()" class="primary">保存本日核查</button><button onclick="resetDay()">恢复示例</button></div><div class="table"><table><thead><tr><th>品名</th><th>初始库存</th><th>进货(箱)</th><th>箱规</th><th>进货(瓶)</th><th>销量</th><th>实际剩余</th><th>漏单</th><th>状态</th></tr></thead><tbody id="tb"></tbody></table></div></main><script>const BASE=[['雪花纯生',48,0,24,14,33],['超级勇闯',51,0,12,0,51],['百威',35,0,12,0,35],['喜力',29,0,12,6,23],['老雪花',40,0,12,11,28],['青岛',1,3,12,0,37],['乌毡帽',8,0,6,0,8],['大窑荔爱',41,0,12,5,36],['大窑橙诺',45,1,12,10,47],['北冰洋',54,0,24,1,53],['听可乐',46,0,24,8,38],['听雪碧',31,0,24,5,26],['无糖可乐',44,0,24,0,44],['王老吉',28,1,24,6,46],['果粒橙',22,0,12,1,21],['大可乐',22,0,12,2,20],['大雪碧',13,0,12,1,12],['矿泉水',36,0,24,0,36],['唯怡豆奶',44,0,24,4,40],['椰子水',15,0,24,4,11],['光明酸奶',5,1,12,1,16],['30白啤',15,0,12,0,15],['力波白啤',8,0,12,1,7],['小郎酒',17,0,24,0,17],['古越龙山',2,1,12,0,14]].map(x=>({name:x[0],start:x[1],cases:x[2],caseSize:x[3],sales:x[4],actual:x[5]}));const KEY='drink-audit-v1';let rows=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(BASE));function calc(r){return r.start+r.cases*r.caseSize-r.sales-r.actual}function render(){tb.innerHTML='';let theory=0,actual=0,bad=0;rows.forEach((r,i)=>{let incoming=r.cases*r.caseSize,m=calc(r);theory+=r.start+incoming-r.sales;actual+=r.actual;if(m!==0)bad++;let tr=document.createElement('tr');tr.innerHTML=`<td class="name">${r.name}</td><td><input value="${r.start}" onchange="u(${i},'start',this.value)"></td><td><input value="${r.cases}" onchange="u(${i},'cases',this.value)"></td><td><input value="${r.caseSize}" onchange="u(${i},'caseSize',this.value)"></td><td class="green">${incoming}</td><td><input value="${r.sales}" onchange="u(${i},'sales',this.value)"></td><td><input value="${r.actual}" onchange="u(${i},'actual',this.value)"></td><td class="${m===0?'green':'red'}">${m}</td><td><span class="badge ${m===0?'ok':'bad'}">${m===0?'正常':'异常'}</span></td>`;tb.appendChild(tr)});s1.textContent=rows.length;s2.textContent=theory;s3.textContent=actual;s4.textContent=bad;localStorage.setItem(KEY,JSON.stringify(rows))}function u(i,k,v){rows[i][k]=parseInt(v||0);render()}function saveDay(){let d=new Date().toISOString().slice(0,10);localStorage.setItem(KEY+'-'+d,JSON.stringify(rows));alert('已保存 '+d)}function carry(){let d=new Date();d.setDate(d.getDate()-1);let k=KEY+'-'+d.toISOString().slice(0,10),prev=JSON.parse(localStorage.getItem(k)||'null');if(!prev)return alert('没有昨日记录');let mp=Object.fromEntries(prev.map(r=>[r.name,r.actual]));rows.forEach(r=>{if(mp[r.name]!=null)r.start=mp[r.name]});render()}function resetDay(){rows=JSON.parse(JSON.stringify(BASE));render()}render();</script></body></html>
