<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09131f"><title>古美酒水日盘</title><style>*{box-sizing:border-box}body{margin:0;background:#09131f;color:#eef4fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.title{font-size:18px;font-weight:800}.dateTabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:250px}.dateBtn{border:1px solid #2b3b4e;background:#101b28;color:#aebdcd;border-radius:8px;padding:7px 10px;text-align:left;font-size:11px}.dateBtn b{display:block;color:#fff;font-size:13px;margin-top:2px}.dateBtn.active{background:#12325a;border-color:#2b79ef;color:#76adff}.btn{height:34px;border:1px solid #2b3b4e;background:#101b28;color:#eef4fb;border-radius:7px;padding:0 10px;font-weight:700}.blue{background:#1768e7;border-color:#1768e7}.green{background:#25833d;border-color:#25833d}.red{background:#9d3131;border-color:#9d3131}.summary{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.card{flex:0 0 94px;background:#101c2a;border:1px solid #203247;border-radius:8px;padding:8px 9px;color:#99aabd;font-size:10px}.card strong{display:block;color:#fff;font-size:18px;margin-top:2px}.parser,.panel{background:#0d1825;border:1px solid #203247;border-radius:8px;margin-bottom:8px}.parser{padding:9px}.parserTitle{font-size:14px;font-weight:800;margin-bottom:5px}.parserHint{font-size:10px;color:#8396aa;margin-bottom:7px}.parserGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.parserBox label{display:block;font-size:11px;font-weight:700;margin-bottom:4px}.parser textarea{width:100%;min-height:76px;background:#101820;color:#fff;border:1px solid #304052;border-radius:6px;padding:7px;font-size:12px;line-height:1.4}.rowBtns{display:flex;gap:6px;margin-top:6px;overflow:auto}.result{font-size:10px;color:#8fa2b7;margin-top:5px;line-height:1.5}.tabs{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px 0;border-bottom:1px solid #223247;flex-wrap:wrap}.tabset{display:flex;gap:16px}.tab{font-size:12px;padding:0 2px 7px;color:#a9b7c6;border-bottom:2px solid transparent}.tab.active{color:#4f9cff;border-bottom-color:#368dff;font-weight:700}.actions{display:flex;gap:6px;overflow:auto;padding-bottom:7px}.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch}.sheet{min-width:600px;width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}.sheet th,.sheet td{padding:5px 4px;font-size:11px;height:34px;border-bottom:1px solid #1e2b39;text-align:right;white-space:nowrap;background:#0d1825}.sheet th{font-size:10px;background:#111d2a;position:sticky;top:0;z-index:4}.sheet th:first-child,.sheet td:first-child{text-align:left;position:sticky;left:0;z-index:3;background:#0f1b28;width:92px}.sheet th:first-child{z-index:6;background:#132131}.sheet input{width:48px;height:25px;background:#121a22;border:1px solid #304052;border-radius:4px;color:#fff;text-align:right;padding:0 4px;font-size:12px}.auto{color:#48d26e;font-weight:700}.bad{color:#ff6262;font-weight:800}.badge{display:inline-block;padding:3px 4px;border-radius:5px;font-size:10px;background:#10361f;color:#58da77}.badge.badgeBad{background:#461d20;color:#ff6969}.foot{padding:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;color:#8396aa;font-size:10px;flex-wrap:wrap}.footBtns{display:flex;gap:5px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:100;padding:12px;overflow:auto}.modal.show{display:block}.modalBox{max-width:700px;margin:auto;background:#101820;border:1px solid #304052;border-radius:10px;padding:10px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}.modal img{width:100%;height:auto;display:block;background:#fff;border-radius:6px}.tip{font-size:12px;color:#c9d4df;margin-top:8px;text-align:center}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16283b;border:1px solid #31506c;padding:9px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:120}.toast.show{opacity:1}@media(max-width:600px){.top{align-items:stretch;flex-direction:column}.dateTabs{min-width:0;width:100%}}@media(min-width:851px){.wrap{padding:18px}.title{font-size:22px}.parserGrid{gap:10px}.sheet{min-width:880px}.sheet th,.sheet td{font-size:13px;height:38px}.sheet th{font-size:12px}.sheet input{width:78px;height:30px}.card{flex:1}}</style></head><body><div class="wrap"><div class="top"><div class="title">古美酒水日盘</div><div class="dateTabs"><button id="yesterdayBtn" class="dateBtn" onclick="openDate(YESTERDAY)"><span>昨天</span><b id="yesterdayText"></b></button><button id="todayBtn" class="dateBtn" onclick="openDate(TODAY)"><span>今天</span><b id="todayText"></b></button></div></div><div class="summary"><div class="card">品项总数<strong id="sCount">0</strong></div><div class="card">理论总库存<strong id="sTheory">0</strong></div><div class="card">实际总库存<strong id="sActual">0</strong></div><div class="card">总差异（漏单）<strong id="sMissing">0</strong></div><div class="card">异常品项<strong id="sBad">0</strong></div></div><section class="parser"><div class="parserTitle">粘贴酒水订货信息</div><div class="parserHint">两个群分别粘贴，系统自动合并件数并换算进货总瓶数。</div><div class="parserGrid"><div class="parserBox"><label>酒水订货</label><textarea id="orderText1" placeholder="北冰洋1件&#10;百威1件&#10;老雪花3件"></textarea></div><div class="parserBox"><label>30公里、椰子水订货</label><textarea id="orderText2" placeholder="1件白啤1件椰子水"></textarea></div></div><div class="rowBtns"><button class="btn blue" onclick="parseOrders()">自动分析两个订货群</button><button class="btn" onclick="clearOrders()">清空</button></div><div id="parseResult" class="result"></div></section><section class="panel"><div class="tabs"><div class="tabset"><div id="tabDaily" class="tab active" onclick="switchTab('daily')">古美酒水日盘</div><div id="tabPack" class="tab" onclick="switchTab('pack')">单件瓶数</div></div><div class="actions"><button class="btn blue" onclick="newDay()">新建今日日盘</button><button class="btn" onclick="carryYesterday()">继承昨日剩余</button><button class="btn" onclick="resetCurrent()">重置</button><button class="btn green" onclick="saveDay()">保存日盘</button></div></div><div class="tablewrap"><table class="sheet"><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div><div class="foot"><div id="formula">漏单 = 初始库存 + 进货总瓶数 − 销量 − 剩余库存</div><div class="footBtns"><button class="btn" onclick="showHistory()">历史</button><button class="btn green" onclick="exportImage()">保存图片</button><button class="btn red" onclick="deleteDay()">删除</button></div></div></section></div><div id="imgModal" class="modal"><div class="modalBox"><div class="modalHead"><b>完整日盘图片</b><button class="btn" onclick="closeImage()">关闭</button></div><img id="resultImage" alt="完整日盘"><div class="tip">iPhone：长按图片 → 存储到“照片”</div></div></div><div id="toast" class="toast"></div><script>
const BASE=[{name:'雪花纯生',start:52,cases:0,caseSize:12,sales:7,actual:45},{name:'超级勇闯',start:15,cases:0,caseSize:12,sales:3,actual:12},{name:'百威',start:25,cases:0,caseSize:12,sales:1,actual:24},{name:'喜力',start:15,cases:0,caseSize:12,sales:8,actual:7},{name:'老雪花',start:12,cases:0,caseSize:12,sales:1,actual:11},{name:'青岛',start:42,cases:0,caseSize:12,sales:10,actual:32},{name:'乌毡帽',start:13,cases:0,caseSize:6,sales:0,actual:13},{name:'大窑荔爱',start:38,cases:0,caseSize:12,sales:2,actual:36},{name:'大窑橙诺',start:32,cases:0,caseSize:12,sales:3,actual:29},{name:'北冰洋',start:15,cases:0,caseSize:24,sales:1,actual:14},{name:'听可乐',start:6,cases:2,caseSize:24,sales:7,actual:47},{name:'听雪碧',start:24,cases:0,caseSize:24,sales:1,actual:23},{name:'无糖可乐',start:24,cases:0,caseSize:24,sales:3,actual:21},{name:'王老吉',start:5,cases:2,caseSize:24,sales:6,actual:47},{name:'果粒橙',start:9,cases:0,caseSize:12,sales:1,actual:8},{name:'大可乐',start:14,cases:0,caseSize:12,sales:3,actual:11},{name:'大雪碧',start:15,cases:0,caseSize:12,sales:0,actual:15},{name:'矿泉水',start:29,cases:0,caseSize:24,sales:3,actual:26},{name:'唯怡豆奶',start:9,cases:1,caseSize:20,sales:2,actual:27},{name:'椰子水',start:6,cases:0,caseSize:15,sales:3,actual:3},{name:'光明酸奶',start:8,cases:0,caseSize:12,sales:4,actual:4},{name:'30白啤',start:10,cases:0,caseSize:6,sales:0,actual:10},{name:'力波白啤',start:8,cases:0,caseSize:6,sales:2,actual:6},{name:'小郎酒',start:11,cases:0,caseSize:24,sales:1,actual:10},{name:'古越龙山',start:3,cases:0,caseSize:12,sales:0,actual:3},{name:'LOOK',start:0,cases:0,caseSize:24,sales:0,actual:0}];
const STORE='gumei-drink-audit-v15';let rows=[],view='daily',currentDate='';const clone=x=>JSON.parse(JSON.stringify(x)),n=v=>Number(v)||0,incoming=r=>n(r.cases)*n(r.caseSize),theory=r=>n(r.start)+incoming(r)-n(r.sales),missing=r=>theory(r)-n(r.actual),key=d=>STORE+'-'+d,draftKey=d=>STORE+'-draft-'+d;
function localISO(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function shiftDate(s,days){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+days);return localISO(d)}function shortDate(s){let d=new Date(s+'T12:00:00');return `${d.getMonth()+1}月${d.getDate()}日`}const TODAY=localISO(),YESTERDAY=shiftDate(TODAY,-1);
function saved(d){let s=localStorage.getItem(key(d));return s?JSON.parse(s):null}function draft(d){let s=localStorage.getItem(draftKey(d));return s?JSON.parse(s):null}function previousRows(d){let p=shiftDate(d,-1);return saved(p)||draft(p)||((p==='2026-09-01')?clone(BASE):null)}function freshFromPrevious(d){let prev=previousRows(d);if(prev){return prev.map(r=>({name:r.name,start:n(r.actual),cases:0,caseSize:n(r.caseSize),sales:0,actual:0}))}let blank=clone(BASE);blank.forEach(r=>{r.start=0;r.cases=0;r.sales=0;r.actual=0});return blank}function defaultForDate(d){if(d==='2026-09-01')return clone(BASE);return freshFromPrevious(d)}
function persist(){localStorage.setItem(draftKey(currentDate),JSON.stringify(rows))}function looksAutoFilledToday(q){return q&&q.length&&q.every(r=>n(r.actual)===n(r.start)&&n(r.sales)===0)}function openDate(d){currentDate=d;let s=saved(d),q=draft(d);if(d===TODAY&&!s&&looksAutoFilledToday(q)){rows=q.map(r=>({...r,actual:0}));localStorage.setItem(draftKey(d),JSON.stringify(rows))}else{rows=s||q||defaultForDate(d)}if(!s&&!q&&d===TODAY)persist();render();updateDateTabs()}function input(i,k,v){rows[i][k]=n(v);persist();render()}
function updateDateTabs(){yesterdayText.textContent=shortDate(YESTERDAY);todayText.textContent=shortDate(TODAY);yesterdayBtn.classList.toggle('active',currentDate===YESTERDAY);todayBtn.classList.toggle('active',currentDate===TODAY)}
function render(){let th=0,ac=0,mi=0,ba=0;rows.forEach(r=>{th+=theory(r);ac+=n(r.actual);mi+=missing(r);if(missing(r)!==0)ba++});sCount.textContent=rows.length;sTheory.textContent=th;sActual.textContent=ac;sMissing.textContent=mi;sBad.textContent=ba;view==='daily'?renderDaily():renderPack()}
function renderDaily(){tabDaily.classList.add('active');tabPack.classList.remove('active');let mobile=innerWidth<=850;thead.innerHTML=mobile?'<tr><th>品名</th><th>初始</th><th>进货</th><th>剩余</th><th>销量</th><th>漏单</th><th>状态</th></tr>':'<tr><th>品名</th><th>初始库存（瓶）</th><th>进货总瓶数</th><th>剩余库存（瓶）</th><th>销量（瓶）</th><th>漏单（瓶）</th><th>状态</th></tr>';tbody.innerHTML=rows.map((r,i)=>{let m=missing(r);return `<tr><td>${r.name}</td><td><input inputmode="numeric" value="${r.start}" onchange="input(${i},'start',this.value)"></td><td class="auto">${incoming(r)}</td><td><input inputmode="numeric" value="${r.actual}" onchange="input(${i},'actual',this.value)"></td><td><input inputmode="numeric" value="${r.sales}" onchange="input(${i},'sales',this.value)"></td><td class="${m?'bad':''}">${m}</td><td><span class="badge ${m?'badgeBad':''}">${m?'异常':'正常'}</span></td></tr>`}).join('');let sum=f=>rows.reduce((a,r)=>a+f(r),0);tfoot.innerHTML=`<tr><td>合计</td><td>${sum(r=>n(r.start))}</td><td>${sum(incoming)}</td><td>${sum(r=>n(r.actual))}</td><td>${sum(r=>n(r.sales))}</td><td>${sum(missing)}</td><td>—</td></tr>`;formula.textContent='漏单 = 初始库存 + 进货总瓶数 − 销量 − 剩余库存'}
function renderPack(){tabDaily.classList.remove('active');tabPack.classList.add('active');thead.innerHTML='<tr><th>品名</th><th>单件瓶数</th><th>订货件数</th><th>进货总瓶数</th></tr>';tbody.innerHTML=rows.map((r,i)=>`<tr><td>${r.name}</td><td><input inputmode="numeric" value="${r.caseSize}" onchange="input(${i},'caseSize',this.value)"></td><td><input inputmode="numeric" value="${r.cases}" onchange="input(${i},'cases',this.value)"></td><td class="auto">${incoming(r)}</td></tr>`).join('');tfoot.innerHTML='';formula.textContent='进货总瓶数 = 单件瓶数 × 当天订货件数'}function switchTab(v){view=v;render()}
function saveDay(){localStorage.setItem(key(currentDate),JSON.stringify(rows));localStorage.setItem(draftKey(currentDate),JSON.stringify(rows));toastMsg(`已保存 ${shortDate(currentDate)}`)}function newDay(){currentDate=TODAY;rows=freshFromPrevious(TODAY);localStorage.setItem(draftKey(TODAY),JSON.stringify(rows));render();updateDateTabs();toastMsg('已新建今日日盘：初始继承昨日，剩余为0')}function carryYesterday(){let prev=previousRows(currentDate);if(!prev)return toastMsg('没有上一日记录');let mp=Object.fromEntries(prev.map(r=>[r.name,r]));rows.forEach(r=>{let p=mp[r.name];if(p){r.start=n(p.actual);r.caseSize=n(p.caseSize)||r.caseSize}r.cases=0;r.sales=0;r.actual=0});persist();render();toastMsg('已继承上一日剩余到初始，今日剩余归0')}function resetCurrent(){let s=saved(currentDate);rows=s?clone(s):defaultForDate(currentDate);localStorage.setItem(draftKey(currentDate),JSON.stringify(rows));render();toastMsg(s?'已恢复到最近保存':'已恢复默认日盘')}
const ALIASES={'小噜渴':'LOOK','小鹿可':'LOOK','噜渴':'LOOK','look':'LOOK','LOOK':'LOOK','上海力波':'力波白啤','力波':'力波白啤','力波白啤':'力波白啤','超级勇闯':'超级勇闯','勇闯':'超级勇闯','大窑橙诺':'大窑橙诺','橙诺':'大窑橙诺'};function norm(s,group){let t=s.trim();if(group===2&&t.includes('白啤'))return '30白啤';if(ALIASES[t])return ALIASES[t];let f=rows.find(r=>t.includes(r.name)||r.name.includes(t));if(f)return f.name;for(let k in ALIASES)if(t.toLowerCase().includes(k.toLowerCase()))return ALIASES[k];return t}function addParsed(name,qty,group,totals,unmatched){name=norm(name,group);let r=rows.find(x=>x.name===name);if(r)totals[name]=(totals[name]||0)+Number(qty);else unmatched.push(name)}function parseGeneric(text,group,totals,unmatched){let src=text.replace(/[，,；;\n]+/g,' '),re=/(\d+(?:\.\d+)?)\s*(?:件|箱)\s*([^0-9\s]+)|([^0-9\s]+?)\s*(\d+(?:\.\d+)?)\s*(?:件|箱)/g,m;while((m=re.exec(src))!==null){if(m[1])addParsed(m[2],m[1],group,totals,unmatched);else addParsed(m[3],m[4],group,totals,unmatched)}}function parseGroup2(text,totals,unmatched){let src=text.replace(/\s+/g,''),rules=[['30白啤','白啤'],['椰子水','椰子水']],cleaned=src;for(let [target,label] of rules){let qty=0,a=[...src.matchAll(new RegExp('(\\d+(?:\\.\\d+)?)\\s*(?:件|箱)\\s*'+label,'g'))],b=[...src.matchAll(new RegExp(label+'\\s*(\\d+(?:\\.\\d+)?)\\s*(?:件|箱)','g'))];a.forEach(m=>qty+=Number(m[1]));b.forEach(m=>qty+=Number(m[1]));if(qty>0){totals[target]=(totals[target]||0)+qty;cleaned=cleaned.replace(new RegExp('\\d+(?:\\.\\d+)?(?:件|箱)'+label,'g'),'').replace(new RegExp(label+'\\d+(?:\\.\\d+)?(?:件|箱)','g'),'')}}if(cleaned)parseGeneric(cleaned,2,totals,unmatched)}function parseOrders(){let t1=orderText1.value.trim(),t2=orderText2.value.trim();if(!t1&&!t2)return toastMsg('先粘贴订货信息');let totals={},un=[];parseGeneric(t1,1,totals,un);parseGroup2(t2,totals,un);rows.forEach(r=>r.cases=0);let out=[];Object.entries(totals).forEach(([name,q])=>{let r=rows.find(x=>x.name===name);if(r){r.cases=q;out.push(`${name}${q}件→${incoming(r)}瓶`)}});persist();render();parseResult.textContent=out.length?'已识别：'+out.join('；')+(un.length?'。未匹配：'+[...new Set(un)].join('、'):''):'没有识别到订货内容';toastMsg('订货已写入')}function clearOrders(){orderText1.value='';orderText2.value='';parseResult.textContent='';toastMsg('已清空')}
function showHistory(){let a=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith(STORE+'-')&&!k.includes('-draft-'))a.push(k.replace(STORE+'-',''))}alert(a.length?'已保存日期：\n'+a.sort().join('\n'):'暂无历史记录')}function deleteDay(){if(!confirm('确定删除 '+shortDate(currentDate)+' 的日盘？'))return;localStorage.removeItem(key(currentDate));localStorage.removeItem(draftKey(currentDate));rows=defaultForDate(currentDate);persist();render();toastMsg('已删除并恢复默认日盘')}
function exportImage(){try{const W=980,rowH=34,topH=170,H=topH+(rows.length+2)*rowH+40,c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d');x.fillStyle='#08111d';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold 28px -apple-system,PingFang SC,sans-serif';x.fillText('古美酒水日盘',28,42);x.font='15px -apple-system,PingFang SC,sans-serif';x.fillStyle='#9fb0c4';x.fillText('日期：'+currentDate,28,68);let sum=f=>rows.reduce((a,r)=>a+f(r),0),stats=[['品项',rows.length],['理论库存',sum(theory)],['实际库存',sum(r=>n(r.actual))],['总漏单',sum(missing)],['异常品项',rows.filter(r=>missing(r)!==0).length]];stats.forEach((s,i)=>{let bx=28+i*184;x.fillStyle='#101c2a';x.fillRect(bx,88,170,54);x.fillStyle='#95a8bd';x.font='12px -apple-system,PingFang SC,sans-serif';x.fillText(s[0],bx+10,108);x.fillStyle='#fff';x.font='bold 20px -apple-system,PingFang SC,sans-serif';x.fillText(String(s[1]),bx+10,134)});let cols=[28,190,315,440,565,690,800],heads=['品名','初始库存','进货总瓶数','剩余库存','销量','漏单','状态'],widths=[162,125,125,125,125,110,140],y=topH;x.font='bold 13px -apple-system,PingFang SC,sans-serif';heads.forEach((h,i)=>{x.fillStyle='#122033';x.fillRect(cols[i],y,widths[i],rowH);x.fillStyle='#dce8f4';x.fillText(h,cols[i]+8,y+22)});rows.forEach((r,ri)=>{y+=rowH;let m=missing(r),vals=[r.name,n(r.start),incoming(r),n(r.actual),n(r.sales),m,m===0?'正常':'异常'];vals.forEach((v,i)=>{x.fillStyle=ri%2?'#0c1722':'#0d1825';x.fillRect(cols[i],y,widths[i],rowH);x.fillStyle=(i>=5&&m!==0)?'#ff6969':(i===6?'#58da77':'#eef4fb');x.font=(i===0||i>=5?'bold ':'')+'13px -apple-system,PingFang SC,sans-serif';x.fillText(String(v),cols[i]+8,y+22)})});y+=rowH;x.fillStyle='#0a1420';x.fillRect(28,y,912,rowH);let totals=['合计',sum(r=>n(r.start)),sum(incoming),sum(r=>n(r.actual)),sum(r=>n(r.sales)),sum(missing),'—'];totals.forEach((v,i)=>{x.fillStyle='#fff';x.font='bold 13px -apple-system,PingFang SC,sans-serif';x.fillText(String(v),cols[i]+8,y+22)});x.fillStyle='#92a6ba';x.font='12px -apple-system,PingFang SC,sans-serif';x.fillText('漏单 = 初始库存 + 进货总瓶数 − 销量 − 剩余库存',28,H-18);resultImage.src=c.toDataURL('image/png');imgModal.classList.add('show');toastMsg('图片已生成，长按保存到照片')}catch(e){toastMsg('图片生成失败，请重试')}}function closeImage(){imgModal.classList.remove('show')}function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
yesterdayText.textContent=shortDate(YESTERDAY);todayText.textContent=shortDate(TODAY);addEventListener('resize',render);openDate(TODAY);
</script></body></html>
